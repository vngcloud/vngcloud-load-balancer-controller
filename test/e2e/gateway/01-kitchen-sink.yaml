# ===== Compact kitchen-sink (≤10 policies — vngcloud's POLICY_PER_LB quota) =====
# 1 listener × 1 hostname × 4 rules × 1 match each = 4 policies.
# Exercises every customizable VKSPolicy field but stays under the cloud limit.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kitchen-mini
  namespace: gw-demo
spec:
  gatewayClassName: vngcloud-alb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kitchen-mini
  namespace: gw-demo
spec:
  parentRefs:
  - name: kitchen-mini
  hostnames:
  - kitchen.example.com
  rules:
  - name: exact-rule
    matches:
    - path:
        type: Exact
        value: /api/v1
    backendRefs:
    - name: echo
      port: 80
      weight: 90
    - name: echo-v2
      port: 80
      weight: 10
  - name: prefix-rule
    matches:
    - path:
        type: PathPrefix
        value: /assets
    backendRefs:
    - name: echo
      port: 80
  - name: regex-rule
    matches:
    - path:
        type: RegularExpression
        value: ^/users/[0-9]+$
    backendRefs:
    - name: echo
      port: 80
  - name: filter-redirect
    matches:
    - path:
        type: PathPrefix
        value: /old
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: new.kitchen.example.com
        statusCode: 301
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSGatewayPolicy
metadata:
  name: kitchen-mini-defaults
  namespace: gw-demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: kitchen-mini
  loadBalancerSpec:
    scheme: Internet
    tags:
      env: smoke-test
  allowedCidrs:
  - 0.0.0.0/0
  - 10.0.0.0/8
  insertHeaders:
    X-Forwarded-For: "true"
    X-Forwarded-Proto: "true"
  timeoutClient: 30s
  timeoutMember: 60s
  timeoutConnection: 5s
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSBackendPolicy
metadata:
  name: echo-policy
  namespace: gw-demo
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo
  targetType: instance
  poolAlgorithm: LEAST_CONNECTIONS
  stickiness: true
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSBackendPolicy
metadata:
  name: echo-v2-policy
  namespace: gw-demo
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo-v2
  targetType: instance
  poolAlgorithm: ROUND_ROBIN
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSHealthCheckPolicy
metadata:
  name: echo-hc
  namespace: gw-demo
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo
  protocol: HTTP
  interval: 15s
  timeout: 4s
  healthyThreshold: 2
  unhealthyThreshold: 3
  httpHealthCheck:
    path: /
    host: kitchen.example.com
    expectedCodes:
    - "200"
    - "201"
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSRoutePolicy
metadata:
  name: prefix-redirect
  namespace: gw-demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kitchen-mini
    sectionName: prefix-rule
  position: 5
  actions:
  - type: Redirect
    redirect:
      url: https://prefix-only.example.com
      httpCode: 302
      keepQueryString: true
---
apiVersion: gateway.vks.vngcloud.vn/v1alpha1
kind: VKSRoutePolicy
metadata:
  name: regex-reject
  namespace: gw-demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kitchen-mini
    sectionName: regex-rule
  actions:
  - type: Reject
