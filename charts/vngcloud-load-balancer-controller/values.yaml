kubernetesClusterDomain: cluster.local
manager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --metrics-secure=false
    - --log-level=info
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: vcr.vngcloud.vn/81-vks-public/vngcloud-load-balancer-controller
      tag: "v0.3.23" # release
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  priorityClassName: system-cluster-critical
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              control-plane: manager
          topologyKey: kubernetes.io/hostname
  podSecurityContext:
    runAsNonRoot: true
  replicas: 1
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: components.vks.vngcloud.vn/vks-managed-components
    operator: Exists
  - effect: NoSchedule
    key: kubernetes.io/arch
    operator: Equal
    value: arm64
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
  topologySpreadConstraints: []
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
mysecret:
  maxConcurrentReconciles: 5
  cluster:
    isRunRemote: false
    clusterID: ""
    namespace: ""
    region: ""
  global:
    clientID: ""
    clientSecret: ""
    identityURL: https://iamapis.vngcloud.vn/accounts-api
    vserverURL: https://hcm-3.api.vngcloud.vn/vserver
  loadBalancerOpts:
    defaultL4PackageName: "NLB_Small"
    defaultL7PackageName: "ALB_Small"
    defaultScheme: "Internet"

    defaultPoolAlgorithm: "ROUND_ROBIN"
    defaultHealthyThreshold: 3
    defaultUnhealthyThreshold: 3
    defaultInterval: 30
    defaultTimeout: 5

    defaultTimeoutClient: 50
    defaultTimeoutMember: 50
    defaultTimeoutConnection: 5
    defaultAllowedCidrs: 0.0.0.0/0
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""

# Gateway API support (Phase 1: L7 ALB only).
# Enabled by default — the chart installs the vngcloud-alb GatewayClass and the
# manager starts the Gateway / HTTPRoute / TargetGroupConfig / ListenerRuleConfig
# reconcilers. Requires the upstream Gateway API CRDs to be installed in the
# cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
#
# To DISABLE this feature, set gatewayApi.alb.enabled=false in values, and
# additionally pass --disable-gateway-api-alb=true via manager.manager.args.
gatewayApi:
  alb:
    enabled: true
    # Optional parametersRef on the GatewayClass — points at a cluster-scope
    # LoadBalancerConfig used as the per-class default. Per-Gateway overrides go
    # via Gateway.spec.infrastructure.parametersRef.
    parametersRef: {}
