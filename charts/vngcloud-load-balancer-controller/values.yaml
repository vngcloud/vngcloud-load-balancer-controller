kubernetesClusterDomain: cluster.local
# gatewayApi toggles Kubernetes Gateway-API support. DISABLED by default so the
# chart installs cleanly on clusters that have not installed the Gateway-API CRDs
# (GatewayClass/Gateway/HTTPRoute). Enable a class only after installing those CRDs.
gatewayApi:
  alb:
    # When true, the chart installs the vngcloud-alb GatewayClass and the
    # controller reconciles it (passes --disable-alb-gateway-controller=false).
    # Requires the Gateway-API CRDs to be installed in the cluster first.
    enabled: false
  nlb:
    # Gateway-API NLB (L4) support — Phase 2. When true, the chart installs the
    # vngcloud-nlb GatewayClass and the controller reconciles it (passes
    # --disable-nlb-gateway-controller=false). In addition to the standard
    # Gateway-API CRDs, this reconciles TCPRoute/UDPRoute, which are Gateway-API
    # *experimental-channel* CRDs that must be installed in the cluster first.
    enabled: false
manager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --metrics-secure=false
    - --log-level=info
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: vcr.vngcloud.vn/81-vks-public/vngcloud-load-balancer-controller
      tag: "v0.3.24" # release
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  priorityClassName: system-cluster-critical
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              control-plane: manager
          topologyKey: kubernetes.io/hostname
  podSecurityContext:
    runAsNonRoot: true
  replicas: 1
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: components.vks.greennode.ai/vks-managed-components
    operator: Exists
  - effect: NoSchedule
    key: kubernetes.io/arch
    operator: Equal
    value: arm64
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
  topologySpreadConstraints: []
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
mysecret:
  maxConcurrentReconciles: 5
  cluster:
    isRunRemote: false
    clusterID: ""
    namespace: ""
    region: ""
  global:
    clientID: ""
    clientSecret: ""
    identityURL: https://iamapis.vngcloud.vn/accounts-api
    vserverURL: https://hcm-3.api.vngcloud.vn/vserver
  loadBalancerOpts:
    defaultL4PackageName: "NLB_Small"
    defaultL7PackageName: "ALB_Small"
    defaultScheme: "Internet"

    defaultPoolAlgorithm: "ROUND_ROBIN"
    defaultHealthyThreshold: 3
    defaultUnhealthyThreshold: 3
    defaultInterval: 30
    defaultTimeout: 5

    defaultTimeoutClient: 50
    defaultTimeoutMember: 50
    defaultTimeoutConnection: 5
    defaultAllowedCidrs: 0.0.0.0/0
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""
