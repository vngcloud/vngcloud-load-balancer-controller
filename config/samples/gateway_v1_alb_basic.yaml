# Basic HTTP Gateway routing all paths on demo.example.com to a backend Service.
# Prerequisite: upstream Gateway API CRDs installed (gateway-api v1.2.0+) and
# the vngcloud-alb GatewayClass present (default-on in the Helm chart;
# set gatewayApi.alb.enabled=false to opt out).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: default
spec:
  gatewayClassName: vngcloud-alb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route
  namespace: default
spec:
  parentRefs:
  - name: demo
  hostnames:
  - demo.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: demo-service
      port: 80
