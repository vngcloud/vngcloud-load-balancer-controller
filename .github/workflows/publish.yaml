name: Release

# RELEASE="1.0.9" bash -c 'git tag $RELEASE && git push origin $RELEASE'

on:
  push:
    tags:
      - "*" # Triggers on version tags, e.g., 1.0.0

env:
  REPO_HCM: vcr.vngcloud.vn/81-vks-public
  REPO_HAN: vcr-han.vngcloud.vn/81-vks-public

jobs:
  build_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to the GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the vCR HCM
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: vcr.vngcloud.vn
          username: ${{ secrets.VCR_USER_PRO }}
          password: ${{ secrets.VCR_PASSWORD_PRO }}

      - name: Log in to the vCR HAN
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: vcr-han.vngcloud.vn
          username: ${{ secrets.VCR_USER_HAN_PRO }}
          password: ${{ secrets.VCR_PASSWORD_HAN_PRO }}

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Debug
        run: echo ${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=v${{ github.ref_name }}
            COMMIT=${{ env.COMMIT_SHORT_SHA }}
          # platforms: linux/amd64
          # outputs: type=registry
          tags: |
            ghcr.io/vngcloud/vngcloud-load-balancer-controller:${{ env.COMMIT_SHORT_SHA }}
            ghcr.io/vngcloud/vngcloud-load-balancer-controller:v${{ github.ref_name }}
            ${{ env.REPO_HCM }}/vngcloud-load-balancer-controller:${{ env.COMMIT_SHORT_SHA }}
            ${{ env.REPO_HAN }}/vngcloud-load-balancer-controller:${{ env.COMMIT_SHORT_SHA }}
            ${{ env.REPO_HCM }}/vngcloud-load-balancer-controller:v${{ github.ref_name }}
            ${{ env.REPO_HAN }}/vngcloud-load-balancer-controller:v${{ github.ref_name }}
            ${{ env.REPO_HCM }}/vngcloud-load-balancer-controller:latest
            ${{ env.REPO_HAN }}/vngcloud-load-balancer-controller:latest
          # target: vngcloud-load-balancer-controller

      - name: Push charts
        env:
          CHANGED_CHARTS: "charts/vngcloud-load-balancer-controller"
        run: |
          helm package ./charts/vngcloud-load-balancer-controller --version ${{ github.ref_name }} --app-version v${{ github.ref_name }}
          helm push ./*.tgz oci://${{ env.REPO_HCM }}/vks-helm-charts
          helm push ./*.tgz oci://${{ env.REPO_HAN }}/vks-helm-charts

  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "${{ github.ref_name }}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${{ github.ref_name }}" \
              --generate-notes

  deploy_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pipenv && pipenv install

      - name: Extract minor version
        id: ver
        run: |
          # 0.3.24 -> v0.3 — minor-only doc versioning (matches kubernetes-sigs/aws-load-balancer-controller).
          # Patch releases update the existing minor folder in place; major.minor bumps publish a new entry.
          MINOR=$(echo "${{ github.ref_name }}" | cut -d. -f1,2)
          echo "minor=v${MINOR}" >> $GITHUB_OUTPUT

      - name: Remove legacy "latest" version (one-time, idempotent)
        run: |
          # Before this workflow existed, main-pushes deployed "latest" as a top-level version
          # (versions.json entry with no aliases). Now "latest" is supposed to be an alias for the
          # newest minor. If the legacy version is still there, remove it so the deploy below can
          # claim "latest" as an alias. After the first successful run this is a no-op.
          if pipenv run mike list --json 2>/dev/null | jq -e '[.[].version] | index("latest")' >/dev/null; then
            echo "Removing orphan 'latest' version from gh-pages..."
            pipenv run mike delete latest --push
          fi

      - name: Deploy versioned docs
        run: |
          pipenv run mike deploy ${{ steps.ver.outputs.minor }} latest --update-aliases --push
          pipenv run mike set-default latest --push
