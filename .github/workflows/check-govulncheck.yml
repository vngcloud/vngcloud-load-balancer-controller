# govulncheck ./...
name: govulncheck
on: push

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(github.event.head_commit.message, '[build]')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.11
          check-latest: true
      - name: Scan for Vulnerabilities in Code
        # NB: govulncheck is pinned to v1.3.0 (NOT @latest). v1.4.0 links
        # golang.org/x/tools@v0.46.0, whose SSA call-graph builder panics on
        # generic code under Go 1.25 ("ForEachElement called on type containing
        # *types.TypeParam"), crashing the default -scan symbol mode. v1.3.0
        # links x/tools@v0.44.0 and scans cleanly. The golang/govulncheck-action
        # only installs @latest, so we invoke govulncheck directly instead.
        # Revisit once upstream ships a fixed x/tools (then bump or drop the pin).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck -C . -format text ./...
